<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>ShopNova - Products</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f7f7f7; }
        h1 { color: #2c3e50; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; }
        .product {
            border: 1px solid #ddd; border-radius: 8px; padding: 15px;
            background: #fff; width: 220px;
        }
        .product h3 { margin: 0 0 8px 0; }
        .product .price { font-size: 18px; color: #e74c3c; font-weight: bold; }
        .product button {
            background: #3498db; color: #fff; border: none;
            padding: 8px 14px; border-radius: 5px; cursor: pointer;
        }
        a { color: #3498db; }
    </style>
</head>
<body>
    <h1>ShopNova - Products</h1>
    <p><a href="/cart">View Cart</a></p>

    <div class="grid">
        {% for product in products %}
        <div class="product" data-id="{{ product.id }}" data-price="{{ '%.2f'|format(product.price) }}">
            <h3>{{ product.name }}</h3>
            <p class="price">&#8377;{{ '%.2f'|format(product.price) }}</p>
            <form action="/add" method="post">
                <input type="hidden" name="product_id" value="{{ product.id }}">
                <button type="submit">Add to Cart</button>
            </form>
        </div>
        {% endfor %}
    </div>
</body>
</html>
